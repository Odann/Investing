name: Update scores

on:
  # Times are UTC. This is 5:37 PM Toronto time in winter (6:37 PM in summer),
  # Monday to Friday, after the TSX closes at 4 PM. Yahoo has no credit limit,
  # but runs much more often than this can get the runner's address rate-limited.
  schedule:
    - cron: "37 22 * * 1-5"
  # Adds a "Run workflow" button on the Actions tab for an on-demand update
  workflow_dispatch:
  # Redeploy the page (without fetching data) when you edit the site
  push:
    branches: [main]
    paths: ["**/docs/index.html", "**/styles/**", "**/tailwind.config.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Works whether the project files sit at the top of the repo or inside a
      # folder (for example stock-board/). Only this workflow file has to be at
      # the top, in .github/workflows/.
      - name: Find the project folder
        run: |
          found=$(git ls-files | grep -E '(^|/)pipeline/update\.py$' | head -n 1)
          if [ -z "$found" ]; then
            echo "::error::Couldn't find pipeline/update.py in this repo. Upload the whole project, not just the workflow."
            exit 1
          fi
          dir=$(dirname "$(dirname "$found")")
          echo "Project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Fetch from Yahoo Finance, score, grade past ratings
        id: pipeline
        if: github.event_name != 'push'
        # If Yahoo fails, still publish the page with the last good data,
        # then mark the run as failed at the end so you notice.
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pip install -r requirements.txt
          python -m pipeline.update

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build the stylesheet
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx --yes tailwindcss@3 -i styles/input.css -o docs/styles.css --minify

      - name: Save data to the repo
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update scores"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed data update
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::The Yahoo Finance update failed (see the 'Fetch from Yahoo Finance' step). The page was published with the last good data."
          exit 1
